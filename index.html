<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src * 'unsafe-inline' 'unsafe-eval' data:;">
  <title>Hosted Checkout</title>
</head>
<body>
  <div id="hco-embedded"></div>

  <!-- note the added data-complete -->
  <script
    src="https://creditlibanais-netcommerce.gateway.mastercard.com/static/checkout/checkout.min.js"
    data-error="errorCallback"
    data-cancel="cancelCallback"
    data-complete="completeCallback">
  </script>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const sessionId = params.get('sessionId');
    const userId    = params.get('userId');
    const orderId   = params.get('orderId');

    if (!sessionId || !userId || !orderId) {
      document.body.innerHTML = 
        '<p style="color:red">Missing sessionId/userId/orderId</p>';
      throw new Error('Missing parameters');
    }

    function errorCallback(err) {
      console.error('HCO error:', err);
      // fallback to telling the app it failed
      window.location = 'myapp://payment-result?status=failure';
    }
    function cancelCallback() {
      console.log('HCO canceled');
      window.location = 'myapp://payment-result?status=cancel';
    }
    function completeCallback() {
      // ⚡️ Hit your backend first so it can verify & update the DB
      window.location = 
        `https://your-backend.com/api/checkout/return`
        + `?userId=${encodeURIComponent(userId)}`
        + `&orderId=${encodeURIComponent(orderId)}`;
    }

    // configure & launch the full-page payment UI
    Checkout.configure({ session: { id: sessionId } });
    window.onload = () => Checkout.showPaymentPage();
  </script>
</body>
</html>
